<title>분당우리교회 주일학교 수련회 반편성 Tool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: header + 4-step tabs (명단 → 기본 정보 → 참석 → 반 배치). The board is a dotted "game board" of class tiles holding name stones. */
:root {
  --bg: #eef1ef;
  --surface: #ffffff;
  --sunken: #f4f6f5;
  --ink: #17211d;
  --muted: #5d6b65;
  --line: #d8dfdb;
  --grid: #cfd8d3;
  --accent: #1f6b52;
  --accent-soft: #e1eee8;
  --accent-ink: #ffffff;
  --male: #2c66c4;
  --male-soft: #e4ecf9;
  --female: #c43f72;
  --female-soft: #f9e5ed;
  --stone: #1d2622;
  --stone-ink: #f2f5f3;
  --warn: #93600f;
  --warn-soft: #faf0dc;
  --bad: #b3322f;
  --bad-soft: #fae5e4;
  --shadow: 0 1px 2px rgba(20, 40, 30, .07), 0 4px 14px rgba(20, 40, 30, .06);
  --f-display: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #161e1b; --sunken: #121916; --ink: #e4ebe7; --muted: #94a39b; --line: #27332e; --grid: #22302a;
    --accent: #55b691; --accent-soft: #1a2f27; --accent-ink: #0b1310;
    --male: #7ca8ee; --male-soft: #1b2639; --female: #ee8bb1; --female-soft: #35202a;
    --stone: #e6ece9; --stone-ink: #111816;
    --warn: #e3b162; --warn-soft: #2e2615; --bad: #f08b87; --bad-soft: #351c1b;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #161e1b; --sunken: #121916; --ink: #e4ebe7; --muted: #94a39b; --line: #27332e; --grid: #22302a;
  --accent: #55b691; --accent-soft: #1a2f27; --accent-ink: #0b1310;
  --male: #7ca8ee; --male-soft: #1b2639; --female: #ee8bb1; --female-soft: #35202a;
  --stone: #e6ece9; --stone-ink: #111816;
  --warn: #e3b162; --warn-soft: #2e2615; --bad: #f08b87; --bad-soft: #351c1b;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 96px;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.top h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
.top .sub { color: var(--muted); margin-top: 2px; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .seg button:focus-visible, .tab:focus-visible, .chipbtn:focus-visible, .drop-zone:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.btn.danger { color: var(--bad); }
.btn svg { width: 15px; height: 15px; flex: none; }

.steps { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; overflow-x: auto; }
.tab { flex: 1 0 auto; border: 0; background: transparent; border-radius: 9px; padding: 9px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab .n { font-family: var(--f-num); font-size: 11.5px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); }
.tab.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tab.on .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab .meta { font-size: 12px; font-weight: 400; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { font-size: 16px; font-weight: 600; }
.panel h3 { font-size: 14px; font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; }
.notice { border-radius: 8px; padding: 9px 12px; font-size: 13px; background: var(--warn-soft); color: var(--warn); }
.notice.ok { background: var(--accent-soft); color: var(--accent); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; }

.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.flow .card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--sunken); }
.flow .card b { font-family: var(--f-num); font-weight: 500; color: var(--accent); font-size: 12px; }
.drop-zone { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; background: var(--surface); }
.drop-zone.over, .drop-zone:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--sunken); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--f-num); white-space: nowrap; }
.mute { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; border-radius: 999px; padding: 1px 9px; background: var(--sunken); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip b { font-family: var(--f-num); font-weight: 500; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.inp { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--sunken); min-width: 0; }
.inp:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.inp.num { font-family: var(--f-num); }
textarea.inp { resize: vertical; min-height: 60px; line-height: 1.5; }
.cgrp { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.cgh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.cgh h3 { font-size: 14px; }
.cgrp .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.auto { font-size: 11px; border-radius: 4px; padding: 0 5px; background: var(--accent-soft); color: var(--accent); }
.auto.manual { background: var(--warn-soft); color: var(--warn); cursor: pointer; border: 0; }
.team { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; background: var(--sunken); }
.team .members { grid-column: 1 / -1; }
.team .inp { background: var(--surface); }
@media (max-width: 560px) { .team { grid-template-columns: minmax(0, 1fr) auto; } .team .fld:nth-child(2) { grid-column: 1 / -1; grid-row: 2; } }

.atttabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.atttab { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.atttab b { font-size: 14px; }
.atttab span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.atttab.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.atttab.on b { color: var(--accent); }
.atttab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.daystat { display: flex; flex-wrap: wrap; gap: 8px; }
.daystat div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; background: var(--sunken); font-size: 12.5px; }
.daystat b { font-family: var(--f-num); font-weight: 500; font-size: 14px; }
.att-group { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.att-group > header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--sunken); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.att-row { display: grid; grid-template-columns: minmax(120px, 220px) auto minmax(0, 1fr); gap: 8px 12px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line); }
.att-row:last-child { border-bottom: 0; }
.att-row.out .who span { color: var(--muted); text-decoration: line-through; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who small { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
@media (max-width: 640px) { .att-row { grid-template-columns: minmax(0, 1fr) auto; } .att-row .days { grid-column: 1 / -1; } .att-row .days:empty { display: none; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--sunken); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 10px; border-radius: 6px; font-size: 12.5px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button.on[data-v="in"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button.on[data-v="part"] { background: var(--warn); color: var(--surface); font-weight: 600; }
.seg button.on[data-v="out"] { background: var(--muted); color: var(--surface); font-weight: 600; }
.days { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chipbtn.on { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; display: inline-block; }
.dot.m { background: var(--male); } .dot.f { background: var(--female); }

.verbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.verlab { font-size: 12px; color: var(--muted); margin-right: 4px; }
.verchip { border: 1px solid var(--line); background: var(--sunken); border-radius: 999px; padding: 4px 14px; font-family: var(--f-num); font-size: 13px; cursor: pointer; color: var(--muted); }
.verchip.on { background: var(--stone); color: var(--stone-ink); border-color: var(--stone); font-weight: 500; }
.verchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.daytabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.daytab { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; min-width: 150px; }
.daytab b { font-size: 14px; }
.daytab span { font-size: 12px; color: var(--muted); }
.daytab span.bad { color: var(--bad); }
.daytab.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.daytab.on b { color: var(--accent); }
.daytab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.boardbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.kpis { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.kpis div { display: flex; gap: 5px; align-items: baseline; }
.kpis b { font-family: var(--f-num); font-weight: 500; font-size: 17px; }
.kpis span { color: var(--muted); font-size: 12.5px; }
.kpis .bad b, .kpis .bad span { color: var(--bad); }

.board { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 14px; align-items: start; border-radius: 14px; padding: 14px;
  background-color: var(--sunken); background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px); background-size: 20px 20px; border: 1px solid var(--line); }
@media (max-width: 960px) { .board { grid-template-columns: minmax(0, 1fr); padding: 10px; } }
.tray { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); max-height: calc(100vh - 40px); min-width: 0; transition: border-color .12s, box-shadow .12s; }
@media (max-width: 960px) { .tray { position: static; max-height: none; } }
.tray > header { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
.tray > header h3 { font-size: 14px; }
.tray .body { padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
.tray .lab { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.stones { display: flex; flex-wrap: wrap; gap: 6px; }
.gsecs { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; align-items: start; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); transition: border-color .12s, box-shadow .12s; }
.tile.nodrop { opacity: .35; }
.tile.noteacher { border-color: var(--bad); }
[data-drop].over { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
body.picking [data-drop] { cursor: pointer; border-style: dashed; border-color: var(--accent); }
.tile > header { padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line); }
.tname { display: flex; align-items: center; gap: 6px; }
.tname input { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 1px 6px; margin-left: -6px; font-family: var(--f-display); font-weight: 700; font-size: 15.5px; }
.tname input:hover { border-color: var(--line); }
.tname input:focus { outline: 2px solid var(--accent); }
.tcount { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); align-items: center; }
.tcount b { font-family: var(--f-num); font-weight: 500; color: var(--ink); }
.flag { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; background: var(--bad-soft); color: var(--bad); }
.flag.soft { background: var(--warn-soft); color: var(--warn); }
.badge { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; white-space: nowrap; background: var(--sunken); color: var(--muted); }
.badge.m { background: var(--male-soft); color: var(--male); }
.badge.f { background: var(--female-soft); color: var(--female); }
.gsec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.gsec + .gsec { margin-top: 6px; }
.gsec > h3 { font-size: 14px; display: flex; align-items: center; gap: 8px; }
.gsec > h3 .bar { width: 4px; height: 16px; border-radius: 2px; background: var(--muted); }
.gsec.m > h3 .bar { background: var(--male); } .gsec.f > h3 .bar { background: var(--female); }
.gsec > h3 span { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.tile.m > header { box-shadow: inset 0 3px 0 var(--male); border-radius: 12px 12px 0 0; }
.tile.f > header { box-shadow: inset 0 3px 0 var(--female); border-radius: 12px 12px 0 0; }
.tslot { padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px dashed var(--line); min-height: 46px; align-items: center; }
.tslot .empty { font-size: 12px; color: var(--bad); }
.sslot { padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 56px; align-content: flex-start; }
.sslot .empty, .tray .empty { font-size: 12px; color: var(--muted); }
.paste { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; background: var(--sunken); }
.paste summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
.paste[open] { display: flex; flex-direction: column; gap: 8px; }
.paste textarea { font-size: 13px; }
.tfrows { display: flex; flex-direction: column; gap: 6px; }
.tfrow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
.tfrow .chip { justify-self: start; }
@media (max-width: 560px) { .tfrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.slotlist { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.team-tile .pos { flex-direction: column; align-items: flex-start; gap: 4px; }
.poshead { display: flex; align-items: center; gap: 6px; width: 100%; }
.posin { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 1px 4px; margin-left: -4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.posin:hover { border-color: var(--line); }
.posin:focus { outline: 2px solid var(--accent); color: var(--ink); }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
.x:hover { color: var(--bad); }
.addslot { padding: 2px 8px; border-bottom: 1px dashed var(--line); }
.pc .cnt { font-size: 10px; border-radius: 3px; padding: 0 4px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pc.ext { border-style: dashed; }
.team-tile .tslot, .team-tile .sslot { position: relative; transition: background .12s; }
.slotlab { font-size: 11px; color: var(--muted); width: 100%; letter-spacing: .02em; }
.team-tile .tslot { border-bottom: 1px dashed var(--line); }
.tslot.over, .sslot.over { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent) !important; border-color: var(--line) !important; }
body.picking .tslot[data-drop], body.picking .sslot[data-drop] { border-style: dashed; }
.pc.gone { opacity: .5; }
.edited { font-size: 10.5px; border-radius: 3px; padding: 0 4px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.absent { padding: 0 12px 10px; font-size: 11.5px; color: var(--muted); }

.pc { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: manipulation; max-width: 100%; transition: transform .1s, box-shadow .1s; }
.pc:hover { box-shadow: 0 2px 6px rgba(0,0,0,.1); transform: translateY(-1px); }
.pc:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pc .st { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; flex: none; background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.pc.m .st { background: var(--male-soft); color: var(--male); border-color: var(--male); }
.pc.f .st { background: var(--female-soft); color: var(--female); border-color: var(--female); }

function layout(day) {

    const at = t.closest('[data-att]'); if (at) { setAtt(at.closest('[data-pid]').dataset.pid, at.dataset.att); save(); render(); return; }
    const dd = t.closest('[data-day]'); if (dd) { const pid = dd.closest('[data-pid]').dataset.pid; const days = new Set(attOf(pid).days || []); days.has(dd.dataset.day) ? days.delete(dd.dataset.day) : days.add(dd.dataset.day); S.att[pid] = { s: 'part', days: [...days].sort() }; save(); render(); return; }
    const bk = t.closest('[data-bulk]'); if (bk) { const sc = bk.dataset.scope; const list = sc === 'T:class' ? S.teachers.filter(t => CLASS_ROLES.has(t.role)) : sc === 'T:staff' ? S.teachers.filter(t => !CLASS_ROLES.has(t.role)) : S.students.filter(s => (s.cls || '') === sc.slice(2)); list.forEach(p => setAtt(p.id, bk.dataset.bulk)); save(); render(); return; }
    if (S.step === 'board' || S.step === 'teams') {
      if (t.closest('input')) return;
      const pc = t.closest('.pc[data-pid]');
      if (pc) { const pid = pc.dataset.pid; const here = pc.closest('[data-drop]').dataset.drop; if (sel && sel !== pid) dropTo(sel, here, selFrom); else setSel(sel === pid ? null : pid, here); return; }
      const dz = t.closest('[data-drop]'); if (dz && sel) dropTo(sel, dz.dataset.drop, selFrom);
    }
  });
  document.addEventListener('keydown', e => { const pc = e.target.closest && e.target.closest('.pc[data-pid]'); if (pc && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pc.click(); } });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'mTitle') { S.meta.title = t.value; save(); setSub(); return; }
    if (t.dataset.ov) { if (t.value === '') delete S.info.ov[t.dataset.ov]; else S.info.ov[t.dataset.ov] = t.value; save(); return; }
    if (t.dataset.tft) { const r = S.info.tfList.find(x => x.id === t.dataset.tft); if (r) { r.title = t.value; save(); } return; }
    if (t.dataset.tfw) { const r = S.info.tfList.find(x => x.id === t.dataset.tfw); if (r) { r.who = whoOf(t.value); save(); } return; }
    if (t.dataset.slottitle) { const [tid, sid] = t.dataset.slottitle.split(':'); const tm = S.info.teams.find(x => x.id === tid); const x = tm && tm.slots.find(y => y.id === sid); if (x) { x.title = t.value; save(); } return; }
    if (t.dataset.teamname) { const tm = S.info.teams.find(x => x.id === t.dataset.teamname); if (tm) { tm.name = t.value; save(); } return; }
    if (t.dataset.gname) { const g = plan(S.day).groups.find(x => x.id === t.dataset.gname); if (g) { g.name = t.value; save(); } }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'mStart' || t.id === 'mEnd') { if (t.value && t.value < '2026-01-01') { toast('2026년부터 고를 수 있어요.'); render(); return; } S.meta[t.id === 'mStart' ? 'start' : 'end'] = t.value; if (t.id === 'mStart' && (!S.meta.end || S.meta.end < t.value)) S.meta.end = t.value; save(); render(); return; }
    if (t.dataset.ov || t.dataset.tfw) render();
  });

  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' || e.button !== 0 || (S.step !== 'board' && S.step !== 'teams')) return;
    const pc = e.target.closest('.pc[data-pid]'); if (!pc) return;
    const r = pc.getBoundingClientRect();
    const fromZ = pc.closest('[data-drop]');
    drag = { pid: pc.dataset.pid, from: fromZ ? fromZ.dataset.drop : '', el: pc, x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, started: false, ghost: null, over: null };
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
      drag.started = true; drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add("dragghost"); drag.ghost.classList.remove('sel'); document.body.appendChild(drag.ghost); drag.el.classList.add('lift');
      document.body.style.cursor = 'grabbing';
      markNoDrop(drag.pid);
    }
    e.preventDefault();
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
    const under = document.elementFromPoint(e.clientX, e.clientY); let dz = under && under.closest('[data-drop]');
    if (dz && dz.classList.contains('nodrop')) dz = null;
    if (dz !== drag.over) { if (drag.over) drag.over.classList.remove('over'); drag.over = dz; if (dz) dz.classList.add('over'); }
    if (e.clientY < 50) window.scrollBy(0, -14); else if (e.clientY > window.innerHeight - 50) window.scrollBy(0, 14);
  });
  document.addEventListener('pointerup', () => {
    if (!drag) return;
    const d = drag; drag = null; document.body.style.cursor = '';
    if (!d.started) return;
    justDragged = true; setTimeout(() => { justDragged = false; }, 0);
    markNoDrop(null); d.ghost.remove(); d.el.classList.remove('lift'); if (d.over) d.over.classList.remove('over');
    if (d.over) dropTo(d.pid, d.over.dataset.drop, d.from);
  });
  document.addEventListener('pointercancel', () => { if (drag && drag.ghost) { drag.ghost.remove(); drag.el.classList.remove('lift'); } drag = null; document.body.style.cursor = ''; });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
