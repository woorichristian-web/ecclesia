<style>
/* Layout: header + 4-step tabs (명단 → 기본 정보 → 참석 → 반 배치). The board is a dotted "game board" of class tiles holding name stones. */

    --accent: #55b691; --accent-soft: #1a2f27; --accent-ink: #0b1310;
    --male: #7ca8ee; --male-soft: #1b2639; --female: #ee8bb1; --female-soft: #35202a;
    --stone: #e6ece9; --stone-ink: #111816;
    --warn: #e3b162; --warn-soft: #2e2615; --bad: #f08b87; --bad-soft: #351c1b;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #161e1b; --sunken: #121916; --ink: #e4ebe7; --muted: #94a39b; --line: #27332e; --grid: #22302a;
  --accent: #55b691; --accent-soft: #1a2f27; --accent-ink: #0b1310;

[hidden] { display: none !important; }
body {

}

.wrap { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.days { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; display: inline-block; }
.dot.m { background: var(--male); } .dot.f { background: var(--female); }

.daytabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.daytab { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; min-width: 150px; }

  background-color: var(--sunken); background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px); background-size: 20px 20px; border: 1px solid var(--line); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; align-items: start; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); transition: border-color .12s, box-shadow .12s; }
.tile.noteacher { border-color: var(--bad); }
[data-drop].over { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }

.tile > header { padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line); }
.tname { display: flex; align-items: center; gap: 6px; }
.tname input { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 1px 6px; margin-left: -6px; font-family: var(--f-display); font-weight: 700; font-size: 15.5px; }
.tname input:hover { border-color: var(--line); }

.pc { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: manipulation; max-width: 100%; transition: transform .1s, box-shadow .1s; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); align-items: center; }

  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .dragghost { transform: none; } }

<div class="wrap">

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STORE = 'retreat-board-v2';
const ROLES = ['반사', '보조교사', '스탭', '팀장', '행정', '찬양팀', '기타'];
const CLASS_ROLES = new Set(['반사', '보조교사']);
const STAFF_ROLES = new Set(['스탭', '팀장', '행정']);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const STEPS = [['roster', '명단 올리기'], ['info', '기본 정보'], ['attendance', '참석 체크'], ['board', '반 배치']];

/* ================= state ================= */
const blank = () => ({ v: 2, sample: false, meta: { title: '', start: '', end: '' }, classes: [], teachers: [], students: [],
  info: { ov: {}, tf: '', teams: [] }, att: {}, plans: {}, step: 'roster', day: null });

  });

}

async function saveFile(name, buf) {
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  let dl = null;
  if (window.claude && typeof window.claude.use === 'function') { try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; } }
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast(`${name} 파일을 저장했어요.`); }
    catch (e) { const c = e && e.code; if (c === 'declined') return; toast(c === 'rate_limited' ? '저장 창이 이미 열려 있어요. 잠시 후 다시 눌러 주세요.' : '이 화면에서는 파일 저장을 쓸 수 없어요.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function sortedTeachers() { return S.teachers.slice().sort((a, b) => roleOrder(a.role) - roleOrder(b.role) || ko(clsName(a.cls), clsName(b.cls)) || ko(a.name, b.name)); }
function sortedStudents() { return S.students.slice().sort((a, b) => ko(clsName(a.cls), clsName(b.cls)) || ko(a.name, b.name)); }
function counts() {
  const T = S.teachers.filter(t => attendsAny(t.id)), St = S.students.filter(s => attendsAny(s.id));
  const auto = {
    maleT: T.filter(t => t.gender === '남').length, femaleT: T.filter(t => t.gender === '여').length,
    maleS: St.filter(s => s.gender === '남').length, femaleS: St.filter(s => s.gender === '여').length,
    staff: T.filter(t => STAFF_ROLES.has(t.role)).length, praise: T.filter(t => t.praise || t.role === '찬양팀').length
  };
  const out = {}; for (const k in auto) { const o = S.info.ov[k]; const manual = o !== undefined && o !== null && o !== ''; out[k] = { auto: auto[k], manual, v: manual ? Number(o) : auto[k] }; }
  return out;
}
function plan(day) {
  if (!S.plans[day]) S.plans[day] = { groups: S.classes.map(c => ({ id: c.id, name: c.name })), at: {} };
  return S.plans[day];
}
function layout(day) {
  const pl = plan(day); const gids = new Set(pl.groups.map(g => g.id));
  const groups = pl.groups.map(g => ({ g, teachers: [], students: [], offTeachers: [], offStudents: [] }));
  const byId = new Map(groups.map(x => [x.g.id, x]));
  const tray = { teachers: [], students: [] };
  const where = (p, isT) => { if (p.id in pl.at) return gids.has(pl.at[p.id]) ? pl.at[p.id] : ''; if (isT && !CLASS_ROLES.has(p.role)) return ''; return gids.has(p.cls) ? p.cls : ''; };
  sortedTeachers().forEach(p => {
    if (!attends(p.id, day)) { if (CLASS_ROLES.has(p.role) && byId.has(p.cls)) byId.get(p.cls).offTeachers.push(p); return; }
    const g = where(p, true); (g ? byId.get(g).teachers : tray.teachers).push(p);
  });
  sortedStudents().forEach(p => {
    if (!attends(p.id, day)) { if (byId.has(p.cls)) byId.get(p.cls).offStudents.push(p); return; }
    const g = where(p, false); (g ? byId.get(g).students : tray.students).push(p);
  });
  return { groups, tray };
}

  const match = p => !q || p.name.includes(q) || clsName(p.cls).includes(q) || (p.role || '').includes(q);
  const T = sortedTeachers().filter(match);
  const byCls = new Map(); sortedStudents().filter(match).forEach(s => { const k = s.cls || ''; if (!byCls.has(k)) byCls.set(k, []); byCls.get(k).push(s); });
  const head = (title, list, key) => `<header><h3>${esc(title)}</h3><span class="hint">${list.filter(p => attendsAny(p.id)).length}/${list.length}명 참석</span><span class="spacer"></span><button class="btn small ghost" type="button" data-bulk="in" data-scope="${key}">모두 참석</button><button class="btn small ghost" type="button" data-bulk="out" data-scope="${key}">모두 불참</button></header>`;
  const dayList = ds.length ? ds : [{ key: 'all', label: '전체 일정', short: '' }];
  $('#view').innerHTML = `
  <section class="panel">
    <div class="row"><h2>참석 체크</h2><span class="spacer"></span><input class="inp" style="width:220px" type="search" id="attQ" placeholder="이름·학년반·역할 찾기" value="${esc(attFilter)}" aria-label="찾기"></div>
    <p class="hint">처음엔 모두 참석이에요. <b>부분</b>을 누르면 날짜가 나와서 참석하는 날만 고를 수 있어요.</p>
    <div class="daystat">${dayList.map(d => { const t = S.teachers.filter(p => attends(p.id, d.key)).length, s = S.students.filter(p => attends(p.id, d.key)).length; return `<div>${esc(d.label)} <span class="mute">${esc(d.short)}</span><br>교사 <b>${t}</b> · 학생 <b>${s}</b></div>`; }).join('')}</div>
    ${T.length ? `<div class="att-group">${head('선생님', T, 'T')}${T.map(p => attRow(p, true, ds)).join('')}</div>` : ''}
    ${[...byCls.entries()].sort((a, b) => ko(clsName(a[0]), clsName(b[0]))).map(([k, list]) => `<div class="att-group">${head(k ? clsName(k) + ' 학생' : '학년반 없는 학생', list, 'c:' + k)}${list.map(p => attRow(p, false, ds)).join('')}</div>`).join('')}
    ${!T.length && !byCls.size ? '<p class="hint">찾는 사람이 없어요.</p>' : ''}
  </section>
  <div class="row" style="margin-top:16px"><button class="btn" type="button" data-go="info">← 기본 정보</button><span class="spacer"></span><button class="btn primary" type="button" data-go="board">다음: 반 배치 →</button></div>`;
  const qi = $('#attQ'); qi.addEventListener('input', () => { attFilter = qi.value; const pos = qi.selectionStart; renderAtt(); const n = $('#attQ'); n.focus(); n.setSelectionRange(pos, pos); });
}
function setAtt(pid, s) { const a = attOf(pid); if (s === 'in') delete S.att[pid]; else S.att[pid] = { s, days: s === 'part' ? (a.days || []) : [] }; }

/* ================= step 4 ================= */
function stone(p, isT, here, off, demo) {
  const moved = here && p.cls && here !== p.cls && (!isT || CLASS_ROLES.has(p.role));
  const role = isT && p.role && p.role !== '반사' ? `<span class="rl">${esc(p.role)}</span>` : '';
  const attrs = off || demo ? `aria-disabled="true"` : `data-pid="${p.id}" tabindex="0" role="button"`;
  const tip = demo ? '' : ` title="${esc(p.name)}${p.cls ? ' · ' + esc(clsName(p.cls)) : ''}${isT ? ' · ' + esc(p.role) : ''}${off ? ' · 이날 불참' : ''}"`;
  return `<span class="pc ${isT ? 't ' : ''}${gCode(p.gender)}${off ? ' off' : ''}${demo ? ' static' : ''}${sel === p.id ? ' sel' : ''}" ${attrs}${tip}><span class="st">${esc(p.name.slice(0, 1))}</span><span class="nm">${esc(p.name)}</span>${role}${moved ? `<span class="org">${esc(clsName(p.cls))}</span>` : ''}${off ? '<span class="rl">불참</span>' : ''}</span>`;
}
function renderBoard() {
  const ds = dates();
  if (!S.day || !ds.some(d => d.key === S.day)) S.day = ds[0].key;
  const day = S.day; const L = layout(day);
  const noT = L.groups.filter(x => !x.teachers.length && x.students.length);
  const tT = L.groups.reduce((a, x) => a + x.teachers.length, 0) + L.tray.teachers.length;
  const tS = L.groups.reduce((a, x) => a + x.students.length, 0) + L.tray.students.length;
  const idx = ds.findIndex(d => d.key === day);
  $('#view').innerHTML = `
  <div class="stack" style="gap:12px">
    ${ds.length > 1 ? `<div class="daytabs" role="tablist">${ds.map(d => { const l = layout(d.key); const bad = l.groups.filter(x => !x.teachers.length && x.students.length).length; return `<button class="daytab${d.key === day ? ' on' : ''}" role="tab" aria-selected="${d.key === day}" type="button" data-dayt="${d.key}"><b>${d.label} · ${d.short}</b><span class="${bad ? 'bad' : ''}">${bad ? `선생님 없는 반 ${bad}개` : '반마다 선생님 있음'}</span></button>`; }).join('')}</div>` : ''}
    <div class="boardbar">
      <div class="kpis"><div><b>${L.groups.length}</b><span>개 반</span></div><div><b>${tT}</b><span>교사 참석</span></div><div><b>${tS}</b><span>학생 참석</span></div>${noT.length ? `<div class="bad"><b>${noT.length}</b><span>선생님 없는 반</span></div>` : ''}</div>
      <span class="spacer"></span>
      ${idx > 0 ? `<button class="btn small" type="button" data-act="copyPrev">${esc(ds[idx - 1].label)} 배치 가져오기</button>` : ''}
      ${noT.length ? '<button class="btn small" type="button" data-act="spread">선생님 없는 반 학생 나누기</button>' : ''}
      <button class="btn small" type="button" data-act="addGroup">+ 반 추가</button>
      <button class="btn small ghost" type="button" data-act="resetDay">원래 학년반으로</button>
    </div>
    <div class="legend">${stone({ id: '', name: '선생님', gender: '', role: '반사' }, true, '', false, true)}${stone({ id: '', name: '남학생', gender: '남' }, false, '', false, true)}${stone({ id: '', name: '여학생', gender: '여' }, false, '', false, true)}${stone({ id: '', name: '불참 선생님', gender: '', role: '반사' }, true, '', true, true)}<span>이름을 끌어 다른 반에 놓으세요. 휴대폰은 눌러서 고른 뒤 옮길 반을 누르면 돼요. 오른쪽 작은 글씨는 원래 학년반이에요.</span></div>
    <div class="board" id="board">
      <aside class="tray" data-drop="">
        <header><h3>대기석</h3><span class="hint">${L.tray.teachers.length + L.tray.students.length}명</span></header>
        <div class="body">
          <div class="lab">반을 맡지 않은 선생님</div>
          <div class="stones">${L.tray.teachers.map(p => stone(p, true, '', false)).join('') || '<span class="empty">모두 반에 들어갔어요</span>'}</div>
          ${L.tray.students.length ? `<div class="lab">학생</div><div class="stones">${L.tray.students.map(p => stone(p, false, '', false)).join('')}</div>` : ''}
        </div>
      </aside>
      <div class="tiles">${L.groups.map(tile).join('') || '<p class="hint">반이 없어요. 명단을 올리거나 반을 추가하세요.</p>'}</div>
    </div>
  </div>`;
}
function tile(x) {
  const m = x.students.filter(s => s.gender === '남').length, f = x.students.filter(s => s.gender === '여').length;
  const noT = !x.teachers.length && x.students.length;
  const canDel = !S.classes.some(c => c.id === x.g.id);
  return `<section class="tile${noT ? ' noteacher' : ''}" data-drop="${x.g.id}">
    <header>
      <div class="tname"><input id="gn-${x.g.id}" data-gname="${x.g.id}" value="${esc(x.g.name)}" aria-label="반 이름">${canDel ? `<button class="btn small ghost danger" type="button" data-delgroup="${x.g.id}">지우기</button>` : ''}</div>
      <div class="tcount"><span>교사 <b>${x.teachers.length}</b></span><span>학생 <b>${x.students.length}</b></span><span><i class="dot m"></i> ${m}&nbsp; <i class="dot f"></i> ${f}</span>${noT ? '<span class="flag">선생님 없음</span>' : ''}</div>
    </header>
    <div class="tslot">${x.teachers.map(p => stone(p, true, x.g.id, false)).join('')}${x.offTeachers.map(p => stone(p, true, x.g.id, true)).join('')}${!x.teachers.length && !x.offTeachers.length ? '<span class="empty">선생님을 끌어 놓으세요</span>' : ''}</div>
    <div class="sslot">${x.students.map(p => stone(p, false, x.g.id, false)).join('') || '<span class="empty">학생 없음</span>'}</div>
    ${x.offStudents.length ? `<div class="absent">이날 불참 ${x.offStudents.length}명 · ${x.offStudents.map(p => esc(p.name)).join(', ')}</div>` : ''}
  </section>`;
}
function moveTo(pid, gid) { plan(S.day).at[pid] = gid; sel = null; $('#selbar').hidden = true; save(); render(); }
function gradeKey(name) { return String(name).replace(/\s+/g, '').replace(/[-–_.]?\d+반$/, '').replace(/반$/, ''); }
function spread() {
  const L = layout(S.day); const pl = plan(S.day);
  const withT = L.groups.filter(x => x.teachers.length);
  if (!withT.length) { toast('선생님이 있는 반이 없어 나눌 수 없어요.'); return; }
  const size = new Map(withT.map(x => [x.g.id, x.students.length]));
  let moved = 0;
  L.groups.filter(x => !x.teachers.length && x.students.length).forEach(x => {
    const same = withT.filter(y => gradeKey(y.g.name) === gradeKey(x.g.name));
    const pool = same.length ? same : withT;
    x.students.forEach(s => { const tgt = pool.slice().sort((a, b) => size.get(a.g.id) - size.get(b.g.id))[0]; pl.at[s.id] = tgt.g.id; size.set(tgt.g.id, size.get(tgt.g.id) + 1); moved++; });
  });
  save(); render(); toast(`학생 ${moved}명을 선생님 있는 반으로 나눴어요. 같은 학년 반부터 채웠어요.`);
}

/* ================= interactions ================= */
let sel = null;
function setSel(pid) {
  sel = pid; render();
  $('#selbar').hidden = !pid;
  if (pid) { const p = [...S.teachers, ...S.students].find(x => x.id === pid); $('#selText').textContent = `${p ? p.name : ''} 선택됨 · 옮길 반이나 대기석을 누르세요`; }
}
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

let busy = false;
async function doDownload(kind) {
  if (busy) return; busy = true;
  try {
    if (kind === 'template') await saveFile('수련회_명단_템플릿.xlsx', await buildTemplate());
    else { if (!S.teachers.length && !S.students.length) { toast('내려받을 명단이 없어요.'); return; } await saveFile(`${(S.meta.title || '수련회').replace(/[\\/:*?"<>|]/g, '')}_반편성_${stamp()}.xlsx`, await buildData()); }
  } catch (e) { toast(e && e.message === 'excel' ? '엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.' : '파일을 만들지 못했어요.'); }
  finally { busy = false; }
}

let drag = null, justDragged = false;
function init() {
  if (!load()) S = sample();
  const h = location.hash.slice(1); if (STEPS.some(s => s[0] === h)) S.step = h;
  render();
  window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (STEPS.some(s => s[0] === k) && k !== S.step) go(k); });
  $('#btnTemplate').onclick = () => doDownload('template');
  $('#btnData').onclick = () => doDownload('data');
  $('#file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) handleFile(f); });
  $('#selCancel').onclick = () => setSel(null);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sel) setSel(null); });

  document.addEventListener('click', e => {
    if (justDragged) { justDragged = false; return; }
    const t = e.target;
    if (t.closest('#selbar')) return;
    const step = t.closest('[data-step],[data-go]'); if (step) { go(step.dataset.step || step.dataset.go); return; }
    const act = t.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'template') doDownload('template');
      else if (a === 'addTeam') { const tm = { id: nid('g'), name: '', leader: '', members: '' }; S.info.teams.push(tm); save(); render(); const el = $('#tl-' + tm.id); if (el) el.focus(); }
      else if (a === 'copyPrev') { const ds = dates(); const i = ds.findIndex(d => d.key === S.day); if (i > 0) { S.plans[S.day] = JSON.parse(JSON.stringify(plan(ds[i - 1].key))); save(); render(); toast(`${ds[i - 1].label} 배치를 가져왔어요. 이날 불참한 사람은 빠져요.`); } }
      else if (a === 'resetDay') { delete S.plans[S.day]; save(); render(); toast('이날 배치를 원래 학년반으로 되돌렸어요.'); }
      else if (a === 'addGroup') { const pl = plan(S.day); const g = { id: nid('x'), name: `새 반 ${pl.groups.length + 1}` }; pl.groups.push(g); save(); render(); const el = $('#gn-' + g.id); if (el) { el.focus(); el.select(); } }
      else if (a === 'spread') spread();
      return;
    }
    const del = t.closest('[data-delteam]'); if (del) { S.info.teams = S.info.teams.filter(x => x.id !== del.dataset.delteam); save(); render(); return; }
    const un = t.closest('[data-unov]'); if (un) { delete S.info.ov[un.dataset.unov]; save(); render(); return; }
    const dg = t.closest('[data-delgroup]'); if (dg) { const pl = plan(S.day); const id = dg.dataset.delgroup; pl.groups = pl.groups.filter(g => g.id !== id); for (const k in pl.at) if (pl.at[k] === id) pl.at[k] = ''; save(); render(); toast('반을 지웠어요. 그 반에 있던 사람은 대기석으로 갔어요.'); return; }
    const dt = t.closest('[data-dayt]'); if (dt) { S.day = dt.dataset.dayt; sel = null; $('#selbar').hidden = true; save(); render(); return; }
    const at = t.closest('[data-att]'); if (at) { setAtt(at.closest('[data-pid]').dataset.pid, at.dataset.att); save(); render(); return; }
    const dd = t.closest('[data-day]'); if (dd) { const pid = dd.closest('[data-pid]').dataset.pid; const days = new Set(attOf(pid).days || []); days.has(dd.dataset.day) ? days.delete(dd.dataset.day) : days.add(dd.dataset.day); S.att[pid] = { s: 'part', days: [...days].sort() }; save(); render(); return; }
    const bk = t.closest('[data-bulk]'); if (bk) { const sc = bk.dataset.scope; const list = sc === 'T' ? S.teachers : S.students.filter(s => (s.cls || '') === sc.slice(2)); list.forEach(p => setAtt(p.id, bk.dataset.bulk)); save(); render(); return; }
    if (S.step === 'board') {
      if (t.closest('input')) return;
      const pc = t.closest('.pc[data-pid]');
      if (pc) { const pid = pc.dataset.pid; if (sel && sel !== pid) moveTo(sel, pc.closest('[data-drop]').dataset.drop); else setSel(sel === pid ? null : pid); return; }
      const dz = t.closest('[data-drop]'); if (dz && sel) moveTo(sel, dz.dataset.drop);
    }
  });
  document.addEventListener('keydown', e => { const pc = e.target.closest && e.target.closest('.pc[data-pid]'); if (pc && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pc.click(); } });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'mTitle') { S.meta.title = t.value; save(); $('#appTitle').textContent = t.value || '수련회 반편성'; return; }
    if (t.dataset.ov) { if (t.value === '') delete S.info.ov[t.dataset.ov]; else S.info.ov[t.dataset.ov] = t.value; save(); return; }
    if (t.id === 'tf') { S.info.tf = t.value; save(); $('#tfChips').innerHTML = nameChips(t.value); return; }
    if (t.dataset.tf) { const box = t.closest('[data-team]'); const tm = S.info.teams.find(x => x.id === box.dataset.team); if (!tm) return; tm[t.dataset.tf] = t.value; save(); if (t.dataset.tf === 'members') box.querySelector('.tmChips').innerHTML = nameChips(t.value); return; }
    if (t.dataset.gname) { const g = plan(S.day).groups.find(x => x.id === t.dataset.gname); if (g) { g.name = t.value; save(); } }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'mStart' || t.id === 'mEnd') { S.meta[t.id === 'mStart' ? 'start' : 'end'] = t.value; if (t.id === 'mStart' && (!S.meta.end || S.meta.end < t.value)) S.meta.end = t.value; save(); render(); return; }
    if (t.dataset.ov) render();
  });

  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' || e.button !== 0 || S.step !== 'board') return;
    const pc = e.target.closest('.pc[data-pid]'); if (!pc) return;
    const r = pc.getBoundingClientRect();
    drag = { pid: pc.dataset.pid, el: pc, x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, started: false, ghost: null, over: null };
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
      drag.started = true; drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add("dragghost"); drag.ghost.classList.remove('sel'); document.body.appendChild(drag.ghost); drag.el.classList.add('lift');
      document.body.style.cursor = 'grabbing';
    }
    e.preventDefault();
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
    const under = document.elementFromPoint(e.clientX, e.clientY); const dz = under && under.closest('[data-drop]');
    if (dz !== drag.over) { if (drag.over) drag.over.classList.remove('over'); drag.over = dz; if (dz) dz.classList.add('over'); }
    if (e.clientY < 50) window.scrollBy(0, -14); else if (e.clientY > window.innerHeight - 50) window.scrollBy(0, 14);
  });
  document.addEventListener('pointerup', () => {
    if (!drag) return;
    const d = drag; drag = null; document.body.style.cursor = '';
    if (!d.started) return;
    justDragged = true; setTimeout(() => { justDragged = false; }, 0);
    d.ghost.remove(); d.el.classList.remove('lift'); if (d.over) d.over.classList.remove('over');
    if (d.over) moveTo(d.pid, d.over.dataset.drop);
  });
  document.addEventListener('pointercancel', () => { if (drag && drag.ghost) { drag.ghost.remove(); drag.el.classList.remove('lift'); } drag = null; document.body.style.cursor = ''; });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
